name: muapi-studio
version: 4.0.0
description: >
  Integracao completa com a plataforma MuAPI (api.muapi.ai) — backend compartilhado
  com o Open Generative AI project. 40 tools, NADA de demo, stub, mock ou placeholder.
  Cobre: 6 modos de geracao, edicao de video/imagem, marketing, templates, account,
  agents, workflows, creative-agent, vibe-workflow, local models, cost estimation.
author: AI Empire integration
license: MIT
scm: "https://github.com/Anil-matcha/Open-Generative-AI"

capabilities:
  tools:
    - list_models
    - generate_image
    - generate_video
    - generate_audio
    - image_to_image
    - image_to_video
    - video_to_video
    - lip_sync
    - upload_file
    - clip_video
    - motion_graphics
    - motion_graphics_edit
    - recast_character
    - motion_control
    - upscale_image
    - remove_background
    - expand_image
    - decompose_layers
    - marketing_ad
    - templates
    - execute_template
    - account_balance
    - generation_history
    - estimate_cost
    - calculate_cost
    - download_url
    - prompt_enhance
    - delete_media
    - list_agents
    - create_agent
    - chat_with_agent
    - agent_library
    - creative_agent
    - create_workflow
    - workflow_inspect
    - workflow_debug
    - workflow_advanced
    - workflow_node_schemas
    - app_interest
    - list_local_models
  prompts:
    - muapi_system_prompt
  templates:
    - media_generation_request

required_mcps: []
optional_mcps: []
required_data:
  - data/model_catalog.json

sandbox_profile: heavy
network_policy:
  allow: ["api.muapi.ai", "*.muapi.ai", "cdn.muapi.ai"]
  deny: ["localhost", "127.0.0.1", "169.254.169.254", "metadata.google.internal"]

self_test:
  - tool: workflow_node_schemas
    input: {category: "image", limit: 3}
    expect: ["ok"]
  - tool: list_local_models
    input: {provider: "sdcpp"}
    expect: ["ok"]
  - tool: prompt_enhance
    input: {action: "validate", prompt: "a cat in a garden"}
    expect: ["ok"]
