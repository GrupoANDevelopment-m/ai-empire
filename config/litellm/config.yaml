# LiteLLM — unified LLM gateway config
# AI Empire uses this to route between Ollama, Anthropic, OpenAI with one OpenAI-compatible endpoint.

model_list:
  # Local — Ollama
  - model_name: "qwen2.5:0.5b"
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://ollama:11434
  - model_name: "qwen2.5:3b"
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: http://ollama:11434
  - model_name: "qwen2.5:7b"
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434

  # Cloud — only if keys present
  - model_name: "claude-sonnet-4-5"
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
  - model_name: "gpt-4o-mini"
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "os.environ/OPENAI_API_KEY"

router_settings:
  num_retries: 3
  timeout: 600
  enable_caching: true
  cache_ttl: 3600

litellm_settings:
  drop_params: true
  telemetry: false
  success_callback: ["langfuse"]    # only if langfuse is up
