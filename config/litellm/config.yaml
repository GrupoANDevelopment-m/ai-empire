# LiteLLM Proxy configuration
# Routes across multiple LLM providers, with fallback and load balancing
# All models are accessible at http://localhost:4000/v1/chat/completions

model_list:
  # Anthropic Claude — best quality
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 200

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 400

  # OpenAI
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      rpm: 200

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500

  # Local Ollama
  - model_name: llama3.3
    litellm_params:
      model: ollama/llama3.3
      api_base: os.environ/OLLAMA_API_BASE
      rpm: 1000

  - model_name: qwen3
    litellm_params:
      model: ollama/qwen3
      api_base: os.environ/OLLAMA_API_BASE
      rpm: 1000

  # "Smart" alias — routes to best available Claude
  - model_name: smart
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 100

  # "Fast" alias — routes to cheapest fast model
  - model_name: fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 200

  # "Local" alias — always uses local Ollama
  - model_name: local
    litellm_params:
      model: ollama/llama3.3
      api_base: os.environ/OLLAMA_API_BASE
      rpm: 1000

# Router settings — load balance + fallback
router_settings:
  # Distribute requests across deployments of the same model
  routing_strategy: usage-based-routing-v2

  # Fallback chains — if primary fails, try these in order
  fallbacks:
    - claude-sonnet-4-5: ["claude-haiku-4-5", "gpt-4o", "llama3.3"]
    - claude-haiku-4-5: ["gpt-4o-mini", "llama3.3"]
    - gpt-4o:           ["claude-sonnet-4-5", "llama3.3"]
    - gpt-4o-mini:      ["llama3.3", "claude-haiku-4-5"]
    - smart:            ["claude-haiku-4-5", "gpt-4o", "llama3.3"]
    - fast:             ["gpt-4o-mini", "llama3.3"]
    - local:            []    # never fallback from local

  # Context window fallback — switch to bigger model if input too long
  context_window_fallbacks:
    - claude-haiku-4-5: ["claude-sonnet-4-5", "gpt-4o"]
    - gpt-4o-mini:      ["gpt-4o", "claude-sonnet-4-5"]

  # Retry policy
  num_retries: 2
  timeout: 120
  retry_after: 5

  # Cooldown settings
  allowed_fails: 3
  cooldown_time: 30

  # Background health checks
  health_check_interval: 30
  health_check_timeout: 5

# LiteLLM-level settings
litellm_settings:
  drop_params: true               # silently drop unsupported params per provider
  set_verbose: false
  telemetry: false
  success_callback: ["langfuse"]  # if Langfuse configured
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 3600

# Server settings
general_settings:
  master_key: os.environ/MASTER_KEY
  database_url: os.environ/DATABASE_URL
  alias: "empire-gateway"
