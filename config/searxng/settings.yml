# SearXNG — minimal settings for AI Empire
# Docs: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  debug: false
  instance_name: "AI Empire SearXNG"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production-use-env-var"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"

engines:
  - name: google
    engine: google
    use_mobile_ui: false
  - name: bing
    engine: bing
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia

ui:
  default_theme: simple
  theme_args:
    simple_style: auto

outgoing:
  pool_connections: 100
  pool_maxsize: 20
