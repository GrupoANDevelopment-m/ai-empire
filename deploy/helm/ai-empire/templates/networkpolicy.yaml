{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-empire.fullname" . }}
  labels:
    {{- include "ai-empire.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-empire.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
