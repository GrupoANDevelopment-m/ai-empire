apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-empire.fullname" . }}-data
  labels:
    {{- include "ai-empire.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-empire.fullname" . }}-browser
  labels:
    {{- include "ai-empire.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.browser.profileStorage | default "5Gi" }}
  storageClassName: gp3
