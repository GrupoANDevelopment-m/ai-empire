apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-empire.fullname" . }}-env
  labels:
    {{- include "ai-empire.labels" . | nindent 4 }}
data:
  LOG_LEVEL: info
  ENVIRONMENT: production
  OLLAMA_BASE_URL: {{ if .Values.llm.ollama.enabled }}{{ .Values.llm.ollama.baseUrl | default "http://ollama:11434" }}{{ end }}
  NVIDIA_NIM_BASE_URL: {{ .Values.llm.nvidia_nim.baseUrl | default "https://integrate.api.nvidia.com/v1" }}
  NVIDIA_NIM_MODEL: {{ .Values.llm.nvidia_nim.model | default "nvidia/nemotron-3-ultra-550b-a55b" }}
  TENANT_ISOLATION: "true"
  PII_REDACTION: {{ .Values.security.pii.enabled | quote }}
  AUDIT_LOG_ENABLED: {{ .Values.security.audit.enabled | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.security.rateLimit.perMinute | quote }}
  SANDBOX_CPU_LIMIT: {{ .Values.sandbox.cpuLimit | quote }}
  SANDBOX_MEMORY_LIMIT: {{ .Values.sandbox.memoryLimit | quote }}
