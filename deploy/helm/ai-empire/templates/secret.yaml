{{- /*
  Secrets for the AI Empire chart.

  Every lookup goes through `get` on a `default dict` chain: a missing
  key yields an empty value instead of the "nil pointer evaluating
  interface {}.secret" error that plain `.Values.x.y` produces.
*/ -}}
{{- $llm := .Values.llm | default dict -}}
{{- $openai := get $llm "openai" | default dict -}}
{{- $anthropic := get $llm "anthropic" | default dict -}}
{{- $nvidia := get $llm "nvidia_nim" | default dict -}}
{{- $muapi := .Values.muapi | default dict -}}
{{- $jwt := .Values.jwt | default dict -}}
{{- $pg := .Values.postgresql | default dict -}}
{{- $pgAuth := get $pg "auth" | default dict -}}
{{- $redis := .Values.redis | default dict -}}
{{- $redisAuth := get $redis "auth" | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-empire.fullname" . }}-secrets
  labels:
    {{- include "ai-empire.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if get $openai "enabled" }}
  OPENAI_API_KEY: {{ get $openai "apiKey" | default "" | quote }}
  {{- end }}
  {{- if get $anthropic "enabled" }}
  ANTHROPIC_API_KEY: {{ get $anthropic "apiKey" | default "" | quote }}
  {{- end }}
  {{- if get $nvidia "enabled" }}
  NVIDIA_NIM_API_KEY: {{ get $nvidia "apiKey" | default "" | quote }}
  NVIDIA_NIM_MODEL: {{ get $nvidia "model" | default "" | quote }}
  {{- end }}
  {{- if get $muapi "enabled" }}
  MUAPI_API_KEY: {{ get $muapi "apiKey" | default "" | quote }}
  {{- end }}
  JWT_SECRET: {{ get $jwt "secret" | default (randAlphaNum 64) | quote }}
  POSTGRES_PASSWORD: {{ get $pgAuth "password" | default "change-me" | quote }}
  REDIS_PASSWORD: {{ get $redisAuth "password" | default "change-me" | quote }}
