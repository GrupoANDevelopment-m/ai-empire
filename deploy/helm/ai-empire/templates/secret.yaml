apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-empire.fullname" . }}-secrets
  labels:
    {{- include "ai-empire.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.llm.openai.enabled }}
  OPENAI_API_KEY: {{ .Values.llm.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.llm.anthropic.enabled }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.llm.nvidia_nim.enabled }}
  NVIDIA_NIM_API_KEY: {{ .Values.llm.nvidia_nim.apiKey | quote }}
  {{- end }}
  {{- if .Values.muapi.enabled }}
  MUAPI_API_KEY: {{ .Values.muapi.apiKey | quote }}
  {{- end }}
  JWT_SECRET: {{ .Values.jwt.secret | default (randAlphaNum 64) | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
