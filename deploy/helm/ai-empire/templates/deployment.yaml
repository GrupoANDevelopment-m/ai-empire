apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-empire.fullname" . }}
  labels:
    {{- include "ai-empire.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-empire.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods for config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ai-empire.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-empire.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "ai-empire.fullname" . }}-env
            - secretRef:
                name: {{ include "ai-empire.fullname" . }}-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
            - name: browser-profiles
              mountPath: /app/data/browser_profiles
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ai-empire.fullname" . }}-data
        - name: browser-profiles
          persistentVolumeClaim:
            claimName: {{ include "ai-empire.fullname" . }}-browser
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "ai-empire.selectorLabels" . | nindent 12 }}
                topologyKey: kubernetes.io/hostname
