apiVersion: v2
name: ai-empire
description: AI Empire — Self-hosted AI Agent Platform
type: application
version: 4.0.0
appVersion: "4.0.0"
home: https://github.com/GrupoANDevelopment-m/ai-empire
sources:
  - https://github.com/GrupoANDevelopment-m/ai-empire
maintainers:
  - name: GrupoANDevelopment-m
    email: contact@grupoan.dev
keywords:
  - ai
  - agents
  - llm
  - platform
  - self-hosted
  - langgraph
  - mcp
# NOTE: Grafana is intentionally NOT a subchart dependency here. The
# Bitnami grafana chart bundles an older bitnami/common library whose
# template API differs from the one postgresql 15.x and redis 18.x
# expect; Helm merges all chart templates into one namespace, so the two
# versions collide and the chart fails to render. Grafana is installed
# separately (the repository ships the provisioning under
# observability/grafana/) and the chart's ServiceMonitor feeds it.
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
