# AI Empire — Production Docker Compose
# Full stack: API, workers, all backing services, observability
# Use: docker compose -f docker-compose.production.yml up -d

version: "3.9"

x-common-labels: &common-labels
  org.opencontainers.image.source: "https://github.com/GrupoANDevelopment-m/ai-empire"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.vendor: "Grupo AN Development"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    labels: "service,environment"

services:
  # ==========================================================================
  # Core API
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    image: ghcr.io/grupoandevelopment-m/ai-empire:4.0.0
    container_name: empire-api
    restart: unless-stopped
    labels:
      <<: *common-labels
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      POSTGRES_URL: postgresql://empire:${POSTGRES_PASSWORD}@postgres:5432/empire
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      MUAPI_API_KEY: ${MUAPI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: empire-api
    volumes:
      - empire-data:/app/data
      - empire-cache:/app/.cache
      - empire-browser:/app/data/browser_profiles
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - empire-internal
      - empire-external
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging: *default-logging

  # Workers (background tasks, scheduled jobs)
  worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.worker
    image: ghcr.io/grupoandevelopment-m/ai-empire:4.0.0
    container_name: empire-worker
    restart: unless-stopped
    command: ["python", "-m", "empire.worker"]
    environment:
      <<: [*api-environment]
    volumes: *api-volumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [empire-internal]
    deploy:
      replicas: 2
      resources: { limits: { cpus: "1.0", memory: 2G } }
    logging: *default-logging

  # Scheduler (cron-like)
  scheduler:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.scheduler
    image: ghcr.io/grupoandevelopment-m/ai-empire:4.0.0
    container_name: empire-scheduler
    restart: unless-stopped
    command: ["python", "-m", "empire.scheduler"]
    environment:
      <<: [*api-environment]
    depends_on: [postgres, redis]
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }
    logging: *default-logging

  # ==========================================================================
  # Browser automation sidecar
  # ==========================================================================
  browser:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.browser
    image: ghcr.io/grupoandevelopment-m/ai-empire-browser:4.0.0
    container_name: empire-browser
    restart: unless-stopped
    environment:
      PROFILE_ROOT: /app/profiles
    volumes:
      - empire-browser:/app/profiles
    ports:
      - "9090:9090"
    networks:
      - empire-internal
    deploy:
      resources: { limits: { cpus: "2.0", memory: 4G } }
    logging: *default-logging

  # ==========================================================================
  # Data stores
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: empire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: empire
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire -d empire"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "4.0", memory: 8G } }
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: empire-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      - --maxmemory 4gb
      - --maxmemory-policy allkeys-lru
      - --appendonly yes
      - --appendfsync everysec
      - --save 60 1000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "2.0", memory: 4G } }
    logging: *default-logging

  # ==========================================================================
  # Observability stack
  # ==========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: empire-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks: [empire-internal, empire-external]
    deploy:
      resources: { limits: { cpus: "1.0", memory: 1G } }
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: empire-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks: [empire-internal, empire-external]
    deploy:
      resources: { limits: { cpus: "2.0", memory: 4G } }
    logging: *default-logging

  loki:
    image: grafana/loki:2.9.4
    container_name: empire-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [empire-internal, empire-external]
    deploy:
      resources: { limits: { cpus: "2.0", memory: 4G } }
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.4.0
    container_name: empire-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"  # HTTP
      - "4317:4317"  # OTLP gRPC
    networks: [empire-internal, empire-external]
    deploy:
      resources: { limits: { cpus: "2.0", memory: 4G } }
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.0
    container_name: empire-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [empire-internal, empire-external]
    depends_on: [prometheus, loki, tempo]
    deploy:
      resources: { limits: { cpus: "1.0", memory: 1G } }
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: empire-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks: [empire-internal, empire-external]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }
    logging: *default-logging

  # Postgres + Redis + Node exporters
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: empire-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://empire:${POSTGRES_PASSWORD}@postgres:5432/empire?sslmode=disable"
    depends_on: [postgres]
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "0.2", memory: 128M } }

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: empire-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [redis]
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "0.2", memory: 128M } }

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: empire-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes:
      - "/:/host:ro,rslave"
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "0.2", memory: 128M } }

  # Reverse proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: empire-nginx
    restart: unless-stopped
    volumes:
      - ./observability/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./observability/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]
    networks: [empire-external]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }
    logging: *default-logging

  # Backup runner (cron-based)
  backup:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    image: ghcr.io/grupoandevelopment-m/ai-empire:4.0.0
    container_name: empire-backup
    restart: unless-stopped
    command: ["python", "scripts/backup.py", "--cron"]
    environment:
      POSTGRES_URL: postgresql://empire:${POSTGRES_PASSWORD}@postgres:5432/empire
      S3_BUCKET: ${BACKUP_S3_BUCKET:-empire-backups}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:-}
    volumes:
      - empire-data:/app/data:ro
    depends_on: [postgres]
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }
    logging: *default-logging

  # Watchtower (auto-update)
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: empire-watchtower
    restart: unless-stopped
    command: ["--schedule", "0 0 4 * * *", "--cleanup", "--label-enable"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [empire-internal]
    deploy:
      resources: { limits: { cpus: "0.2", memory: 128M } }

volumes:
  empire-data:
  empire-cache:
  empire-browser:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  alertmanager-data:

networks:
  empire-internal:
    driver: bridge
    internal: false
  empire-external:
    driver: bridge
