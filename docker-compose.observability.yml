# AI Empire — Observability stack overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Adds: Prometheus (metrics), Loki + Promtail (logs), Tempo (traces),
#       Grafana (dashboards). Wired up to the agent + tools via OTLP.
#
# Configuration:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
#   PROMETHEUS_URL=http://prometheus:9090
#
# Pre-built dashboards (in grafana/dashboards/):
#   - empire-overview.json      — top-level SLI dashboard
#   - llm-cost.json              — token spend + cost per model
#   - tool-latency.json          — p50/p95/p99 per tool
#   - tenant-isolation.json      — cross-tenant violations
#   - hitl-approvals.json        — approval queue depth + latency
#
# Alert rules (in prometheus/alerts.yml):
#   - EmpireHighErrorRate: 5xx > 5% for 5m → page
#   - EmpireSlowLLM: p99 > 30s for 10m → warn
#   - EmpirePIILeak: redactions spike → page
#   - EmpireBudgetBurn: cost > $5/hr → warn
#   - EmpireApproachDown: service down for 1m → page

name: ai-empire-observability

x-observability-vars:
  GF_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-empire}
  LOKI_RETENTION: ${LOKI_RETENTION:-30d}

services:
  # ── OpenTelemetry collector (single binary, scrapes + routes) ───────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ai-empire-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"     # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"     # OTLP HTTP
    networks: [internal]

  # ── Prometheus (metrics scrape + store) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-empire-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [internal]

  # ── Loki (log aggregation) ───────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.2
    container_name: ai-empire-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - LOKI_RETENTION=${LOKI_RETENTION:-30d}
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks: [internal]

  # ── Promtail (log shipping from Docker to Loki) ──────────────────────────
  promtail:
    image: grafana/promtail:3.1.2
    container_name: ai-empire-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    depends_on:
      - loki

  # ── Tempo (distributed tracing backend) ─────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    container_name: ai-empire-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"     # HTTP
      - "4317:4317"                   # OTLP gRPC (so OTEL collector can forward here)
    networks: [internal]

  # ── Grafana (dashboards + alerts UI) ─────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-empire-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_FEATURE_TOGGLES_ENABLE=
    volumes:
      - ./observability/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [internal]

  # ── Alertmanager ─────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ai-empire-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks: [internal]

volumes:
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  grafana_data: {}
  alertmanager_data: {}

networks:
  internal:
    name: ai-empire-internal
