name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Gate 0: lint + syntax + secrets scan ──────────────────────────────────
  lint:
    name: Lint + secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: |
          python -m compileall -q empire orchestrator scripts || true
          find . -name "*.py" -not -path "./.*" | xargs -I{} python -c "import ast; ast.parse(open('{}').read())" || exit 1
      - name: docker-compose syntax check
        run: docker compose config -q || docker-compose config -q
      - name: Secret scan (basic)
        run: |
          # Fail on hardcoded secrets in code
          ! grep -rEn "(api[_-]?key|secret|password|token)\s*=\s*['\"][a-zA-Z0-9_\-]{20,}['\"]" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.sh" empire orchestrator scripts bin install.sh 2>/dev/null || true

  # ── Gate 0: pytest ─────────────────────────────────────────────────────────
  tests:
    name: Tests (104 real pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: empire
          POSTGRES_PASSWORD: empire
          POSTGRES_DB: ai_empire
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-please-rotate-in-production-1234
      JWT_SECRET: ci-test-jwt-secret-rotate-in-production-1234
      DATABASE_URL: postgresql://empire:empire@postgres:5432/ai_empire
      REDIS_URL: redis://redis:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator/requirements.txt
          pip install pytest httpx PyJWT redis asyncpg psutil
      - name: Run tests
        run: |
          cd orchestrator
          python -m pytest tests/ -v --tb=short -x --ignore=tests/test_chaos.py

  # ── Gate 0: docker-compose validation + image pull dry-run ────────────────
  compose:
    name: Compose validation + image verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose syntax (all profiles)
        run: |
          # Validate the YAML is parseable for each profile
          for profile in core agents browser leads design video data crm office gateway lite; do
            echo "Validating profile: $profile"
            docker compose --profile $profile config -q
          done
      - name: Verify image URLs (using verify_images.sh)
        run: |
          chmod +x scripts/verify_images.sh
          bash scripts/verify_images.sh docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # for ghcr.io auth

  # ── Gate 0: security smoke test ────────────────────────────────────────────
  security:
    name: Security smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test JWT/RBAC/PII/rate limit
        run: |
          pip install PyJWT redis httpx
          export SECRET_KEY="x" SECRETS=$(python3 -c "print('x'*64)")
          python - <<'EOF'
          import os
          os.environ['SECRET_KEY'] = 'x' * 64
          os.environ['JWT_SECRET'] = 'x' * 64
          from empire.security.auth import Role, issue_token, verify_token
          from empire.security.rbac import Permission, has_permission, AuthContext
          from empire.security.pii import redact
          from empire.security.rate_limit import RateLimiter

          t = issue_token('u', Role.OPERATOR, 'acme', scope=['run:tests'])
          assert verify_token(t)['sub'] == 'u'
          print('JWT ok')

          a = AuthContext(sub='u', role=Role.OPERATOR, tenant='acme', scope=['run:tests'])
          assert has_permission(a, Permission.RUN_TESTS)
          assert not has_permission(a, Permission.MANAGE_USERS)
          print('RBAC ok')

          assert '[REDACTED' in redact('hi john@example.com')
          print('PII ok')

          rl = RateLimiter(redis_url=None, default_per_min=10, default_burst=20)
          for _ in range(20): rl.check('x', 1)
          ok, _ = rl.check('x', 1)
          assert not ok
          print('Rate limit ok')
          EOF

  # ── Gate 1: build docker images (sanity, no push) ──────────────────────────
  build:
    name: Build orchestrator image
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build orchestrator
        run: docker buildx build -f orchestrator/Dockerfile --tag ai-empire/orchestrator:test .
      - name: Build media-engine
        run: docker buildx build -f Dockerfile.media --tag ai-empire/media-engine:test .
