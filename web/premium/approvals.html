<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprovações HITL — AI Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold-1: #d4a017; --gold-2: #b8860b; --gold-3: #8b6914; --gold-bright: #f4c430;
    --bg-0: #050505; --bg-1: #0a0a0a; --bg-2: #111111; --bg-3: #1a1a1a;
    --border: rgba(212, 160, 23, 0.18); --border-bright: rgba(212, 160, 23, 0.45);
    --text: #e4e4e4; --text-dim: #888888; --text-bright: #ffffff;
    --green: #4ade80; --red: #ef4444; --amber: #f59e0b;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-0); color: var(--text);
    line-height: 1.6; min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at top, rgba(212, 160, 23, 0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(212, 160, 23, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212, 160, 23, 0.025) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none; z-index: 0; opacity: 0.4;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 0.75rem;
    font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.1rem;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-1), var(--gold-3));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .nav-brand-mark {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-3));
    clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 20% 100%, 0% 35%);
    box-shadow: 0 0 20px rgba(212, 160, 23, 0.5);
  }
  .nav-links { display: flex; gap: 1.75rem; }
  .nav-link {
    color: var(--text-dim); text-decoration: none;
    font-size: 0.8rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .nav-link:hover, .nav-link.active { color: var(--gold-bright); }
  .nav-user {
    display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.8rem; color: var(--text-dim);
  }
  .nav-user button {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 0.4rem 0.75rem;
    border-radius: 6px; font-size: 0.75rem;
    cursor: pointer; font-family: inherit;
  }

  /* MAIN */
  main {
    position: relative; z-index: 1;
    padding: 6rem 2rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .page-title {
    font-family: 'Cinzel', serif;
    font-size: 2rem; font-weight: 700;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-1));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  .page-subtitle { color: var(--text-dim); font-size: 0.875rem; margin-bottom: 1.5rem; }

  /* TABS */
  .tabs {
    display: flex; gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .tab {
    background: transparent; border: none;
    color: var(--text-dim); padding: 0.75rem 1.25rem;
    font-size: 0.85rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer; font-family: inherit;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--gold-bright);
    border-bottom-color: var(--gold-1);
  }
  .tab-count {
    background: rgba(212, 160, 23, 0.15);
    color: var(--gold-bright);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    margin-left: 0.5rem;
  }

  /* BATCH BAR */
  .batch-bar {
    background: linear-gradient(135deg, rgba(15, 15, 15, 0.9), rgba(5, 5, 5, 0.9));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 1rem;
    display: none;
  }
  .batch-bar.active { display: flex; }
  .batch-bar .count {
    font-weight: 600;
    color: var(--gold-bright);
  }
  .batch-bar .spacer { flex: 1; }
  .btn {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: var(--bg-0); border: none;
    padding: 0.55rem 1.25rem; border-radius: 6px;
    font-weight: 600; font-size: 0.8rem;
    cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .btn:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(212, 160, 23, 0.35); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary {
    background: transparent; color: var(--gold-bright);
    border: 1px solid var(--border-bright);
  }
  .btn.secondary:hover { background: rgba(212, 160, 23, 0.08); box-shadow: none; }
  .btn.success {
    background: linear-gradient(135deg, var(--green), #16a34a);
    color: var(--bg-0);
  }
  .btn.danger {
    background: linear-gradient(135deg, var(--red), #b91c1c);
    color: white;
  }

  /* APPROVAL CARD */
  .approvals-list {
    display: flex; flex-direction: column;
    gap: 0.75rem;
  }
  .approval-card {
    background: linear-gradient(135deg, rgba(15, 15, 15, 0.9), rgba(5, 5, 5, 0.9));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    transition: all 0.2s;
    position: relative;
  }
  .approval-card.selected {
    border-color: var(--gold-1);
    box-shadow: 0 0 0 1px var(--gold-1);
  }
  .approval-card:hover {
    border-color: var(--border-bright);
  }
  .approval-card.expires-soon {
    border-left: 4px solid var(--amber);
  }
  .approval-card.expired {
    border-left: 4px solid var(--red);
    opacity: 0.6;
  }
  .approval-card.approved {
    border-left: 4px solid var(--green);
    opacity: 0.7;
  }
  .approval-card.rejected {
    border-left: 4px solid var(--red);
    opacity: 0.6;
  }

  .approval-header {
    display: flex; align-items: flex-start;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .approval-checkbox {
    margin-top: 0.2rem;
  }
  .approval-checkbox input {
    width: 18px; height: 18px;
    accent-color: var(--gold-1);
    cursor: pointer;
  }
  .approval-body { flex: 1; min-width: 0; }
  .approval-meta {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
  }
  .approval-action {
    font-weight: 700;
    color: var(--text-bright);
    font-size: 1rem;
  }
  .pill {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .pill.pending { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
  .pill.approved { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid rgba(74, 222, 128, 0.3); }
  .pill.rejected { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
  .pill.expired { background: rgba(136, 136, 136, 0.1); color: var(--text-dim); border: 1px solid var(--border); }

  .approval-summary {
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
  }
  .approval-detail {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--text);
    margin-bottom: 1rem;
    max-height: 160px;
    overflow: auto;
  }
  .approval-detail pre {
    white-space: pre-wrap;
    word-break: break-all;
  }
  .approval-footer {
    display: flex; align-items: center;
    gap: 0.75rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .approval-actor {
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold-1);
  }
  .approval-expires {
    color: var(--amber);
    font-weight: 500;
  }
  .approval-expires.expired { color: var(--red); }

  .approval-actions {
    display: flex; gap: 0.5rem;
    margin-top: 0.75rem;
  }

  /* EMPTY */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    background: linear-gradient(135deg, rgba(15, 15, 15, 0.5), rgba(5, 5, 5, 0.5));
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .empty-state h3 {
    font-family: 'Cinzel', serif;
    color: var(--text-bright);
    margin-bottom: 0.5rem;
  }

  /* TOAST */
  .toast-stack {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 200;
    display: flex; flex-direction: column;
    gap: 0.5rem;
  }
  .toast {
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid var(--border-bright);
    border-left: 3px solid var(--gold-1);
    padding: 0.875rem 1rem;
    border-radius: 6px;
    color: var(--text); font-size: 0.85rem;
    max-width: 320px;
    backdrop-filter: blur(10px);
    animation: slideIn 0.3s ease-out;
  }
  .toast.success { border-left-color: var(--green); }
  .toast.error { border-left-color: var(--red); }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-1); }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold-1), var(--gold-3)); border-radius: 3px; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-brand-mark"></div>
    AI EMPIRE
  </div>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Dashboard</a>
    <a class="nav-link" href="configuracoes.html">Configurações</a>
    <a class="nav-link" href="logs.html">Logs</a>
    <a class="nav-link active" href="approvals.html">Aprovações</a>
  </div>
  <div class="nav-user">
    <span id="user-name">carregando</span>
    <button onclick="logout()">Sair</button>
  </div>
</nav>

<main>
  <h1 class="page-title">Aprovações Humanas</h1>
  <p class="page-subtitle">Ações críticas que requerem confirmação antes de executar (HITL).</p>

  <div class="tabs">
    <button class="tab active" data-tab="pending">Pendentes <span class="tab-count" id="count-pending">0</span></button>
    <button class="tab" data-tab="approved">Aprovadas <span class="tab-count" id="count-approved">0</span></button>
    <button class="tab" data-tab="rejected">Rejeitadas <span class="tab-count" id="count-rejected">0</span></button>
    <button class="tab" data-tab="expired">Expiradas <span class="tab-count" id="count-expired">0</span></button>
  </div>

  <div class="batch-bar" id="batch-bar">
    <span><strong class="count" id="selected-count">0</strong> selecionado(s)</span>
    <span class="spacer"></span>
    <button class="btn success" onclick="batchAction('approve')">Aprovar lote</button>
    <button class="btn danger" onclick="batchAction('reject')">Rejeitar lote</button>
    <button class="btn secondary" onclick="clearSelection()">Cancelar</button>
  </div>

  <div id="approvals-list" class="approvals-list">
    <div class="empty-state">
      <h3>aguardando dados</h3>
      <p>Conecte-se ao backend para ver aprovações pendentes</p>
    </div>
  </div>
</main>

<div class="toast-stack" id="toast-stack"></div>

<script>
const API_HOST = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://localhost:8123'
  : `http://${location.hostname}:8123`;
const TOKEN = localStorage.getItem('empire.token') || '';
const TENANT = localStorage.getItem('empire.tenant') || 'default';

if (!TOKEN) location.href = 'login.html?redirect=approvals.html';

let state = {
  tab: 'pending',
  items: [],
  selected: new Set(),
};

function authHeaders() {
  return { 'Authorization': `Bearer ${TOKEN}`, 'X-Tenant': TENANT, 'Content-Type': 'application/json' };
}

function logout() {
  localStorage.removeItem('empire.token');
  localStorage.removeItem('empire.user');
  location.href = 'login.html';
}

function toast(text, kind = 'info') {
  const stack = document.getElementById('toast-stack');
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.textContent = text;
  stack.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

async function loadUser() {
  try {
    const r = await fetch(`${API_HOST}/api/auth/me`, { headers: authHeaders() });
    if (r.status === 401) { logout(); return; }
    const u = await r.json();
    document.getElementById('user-name').textContent = u.email || u.name || 'user';
  } catch (e) {
    document.getElementById('user-name').textContent = 'offline';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatRelative(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const now = Date.now();
  const diff = (d.getTime() - now) / 1000;
  if (Math.abs(diff) < 60) return 'agora';
  if (diff > 0) {
    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);
    return h > 0 ? `em ${h}h${m}m` : `em ${m}m`;
  } else {
    const past = -diff;
    const h = Math.floor(past / 3600);
    const m = Math.floor((past % 3600) / 60);
    if (h > 24) return `${Math.floor(h/24)}d atrás`;
    return h > 0 ? `${h}h${m}m atrás` : `${m}m atrás`;
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    state.tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.selected.clear();
    refresh();
  });
});

async function refresh() {
  try {
    const r = await fetch(`${API_HOST}/api/approvals?status=${state.tab}&limit=100`,
                         { headers: authHeaders() });
    if (r.status === 401) { logout(); return; }
    const data = await r.json();
    state.items = data.results || [];
    render();
    await refreshCounts();
  } catch (e) {
    document.getElementById('approvals-list').innerHTML =
      `<div class="empty-state"><h3>erro</h3><p>${escapeHtml(e.message)}</p></div>`;
  }
}

async function refreshCounts() {
  for (const status of ['pending', 'approved', 'rejected', 'expired']) {
    try {
      const r = await fetch(`${API_HOST}/api/approvals?status=${status}&limit=1`,
                           { headers: authHeaders() });
      const d = await r.json();
      document.getElementById(`count-${status}`).textContent = d.total ?? d.results?.length ?? 0;
    } catch {}
  }
}

function render() {
  const list = document.getElementById('approvals-list');
  if (!state.items.length) {
    list.innerHTML = `<div class="empty-state">
      <h3>${state.tab === 'pending' ? 'nenhuma aprovação pendente' : 'sem itens'}</h3>
      <p>${state.tab === 'pending' ? 'Todas as ações críticas estão em dia.' : 'Nada nesta categoria ainda.'}</p>
    </div>`;
    document.getElementById('batch-bar').classList.remove('active');
    return;
  }

  list.innerHTML = '';
  state.items.forEach(item => list.appendChild(buildCard(item)));
  updateBatchBar();
}

function buildCard(item) {
  const card = document.createElement('div');
  card.className = 'approval-card';
  card.dataset.id = item.id;

  const now = Date.now();
  const expiresAt = item.expires_at ? new Date(item.expires_at).getTime() : null;
  if (item.status === 'pending' && expiresAt && expiresAt - now < 3600 * 1000) {
    card.classList.add('expires-soon');
  }
  if (item.status === 'expired') card.classList.add('expired');
  if (item.status === 'approved') card.classList.add('approved');
  if (item.status === 'rejected') card.classList.add('rejected');
  if (state.selected.has(item.id)) card.classList.add('selected');

  const showActions = item.status === 'pending';
  card.innerHTML = `
    <div class="approval-header">
      ${showActions ? `
        <label class="approval-checkbox">
          <input type="checkbox" ${state.selected.has(item.id) ? 'checked' : ''}
                 onchange="toggleSelect('${item.id}', this.checked)">
        </label>` : '<div style="width:18px"></div>'}
      <div class="approval-body">
        <div class="approval-meta">
          <span class="approval-action">${escapeHtml(item.action)}</span>
          <span class="pill ${item.status}">${item.status}</span>
        </div>
        <div class="approval-summary">${escapeHtml(item.summary || '')}</div>
        <div class="approval-detail"><pre>${escapeHtml(JSON.stringify(item.payload || {}, null, 2))}</pre></div>
        <div class="approval-footer">
          <span>solicitado por <span class="approval-actor">${escapeHtml(item.actor || '—')}</span></span>
          <span>·</span>
          <span>${formatRelative(item.requested_at)}</span>
          ${item.expires_at ? `
            <span>·</span>
            <span class="approval-expires ${expiresAt < now ? 'expired' : ''}">expira ${formatRelative(item.expires_at)}</span>
          ` : ''}
        </div>
        ${showActions ? `
        <div class="approval-actions">
          <button class="btn success" onclick="act('${item.id}', 'approve')">Aprovar</button>
          <button class="btn danger" onclick="act('${item.id}', 'reject')">Rejeitar</button>
          <button class="btn secondary" onclick="act('${item.id}', 'defer')">Adiar 1h</button>
        </div>` : ''}
      </div>
    </div>`;
  return card;
}

function toggleSelect(id, checked) {
  if (checked) state.selected.add(id);
  else state.selected.delete(id);
  document.querySelector(`[data-id="${id}"]`)?.classList.toggle('selected', checked);
  updateBatchBar();
}

function updateBatchBar() {
  const bar = document.getElementById('batch-bar');
  document.getElementById('selected-count').textContent = state.selected.size;
  bar.classList.toggle('active', state.selected.size > 0);
}

function clearSelection() {
  state.selected.clear();
  refresh();
}

async function act(id, action) {
  try {
    const r = await fetch(`${API_HOST}/api/approvals/${id}/${action}`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ reason: '' }),
    });
    if (r.status === 401) { logout(); return; }
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `${r.status}`);
    }
    toast(`Aprovação ${action === 'approve' ? 'aprovada' : action === 'reject' ? 'rejeitada' : 'adiada'}`,
          action === 'approve' ? 'success' : action === 'reject' ? 'error' : 'info');
    refresh();
  } catch (e) {
    toast(`Erro: ${e.message}`, 'error');
  }
}

async function batchAction(action) {
  const ids = Array.from(state.selected);
  if (!ids.length) return;
  if (!confirm(`${action === 'approve' ? 'Aprovar' : 'Rejeitar'} ${ids.length} item(ns)?`)) return;
  let ok = 0, fail = 0;
  for (const id of ids) {
    try {
      const r = await fetch(`${API_HOST}/api/approvals/${id}/${action}`, {
        method: 'POST', headers: authHeaders(), body: '{}',
      });
      if (r.ok) ok++; else fail++;
    } catch { fail++; }
  }
  toast(`${ok} processado(s), ${fail} falha(s)`, fail ? 'error' : 'success');
  state.selected.clear();
  refresh();
}

// Init
loadUser();
refresh();
setInterval(refresh, 5000);
</script>

</body>
</html>
