groups:
  - name: empire.critical
    interval: 30s
    rules:
      - alert: EmpireHighErrorRate
        expr: |
          sum(rate(empire_requests_total{status=~"5.."}[5m]))
          / sum(rate(empire_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Empire error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"
          runbook: https://wiki.grupoan.dev/runbooks/empire-high-error-rate
      
      - alert: EmpireHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(empire_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "p95 latency > 2s"
          description: "p95 latency is {{ $value }}s"
          runbook: https://wiki.grupoan.dev/runbooks/empire-high-latency
      
      - alert: EmpirePodDown
        expr: up{job="empire-api"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Empire API pod down"
          description: "Pod {{ $labels.instance }} has been down for > 2 minutes"
      
      - alert: EmpirePostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections > 80"
          description: "Currently {{ $value }} active connections"
      
      - alert: EmpireRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 85%"
          description: "Using {{ $value | humanizePercentage }} of max memory"
      
      - alert: EmpireLLMCostSpike
        expr: |
          sum by (tenant_id) (rate(empire_llm_cost_dollars_total[1h])) > 50
        for: 1h
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} spending > $50/hour"
          description: "Hourly spend rate: ${{ $value }}"
      
      - alert: EmpireSandboxOOMKilled
        expr: increase(empire_sandbox_oom_kills_total[5m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Multiple OOM kills in sandbox"
          description: "{{ $value }} OOM kills in last 5 minutes"
      
      - alert: EmpirePIILeak
        expr: increase(empire_pii_audit_log_only_total[5m]) > 0
        labels:
          severity: critical
          team: security
        annotations:
          summary: "PII detected going to audit log"
          description: "PII redaction may be misconfigured"
      
      - alert: EmpireRateLimitFlood
        expr: rate(empire_rate_limit_rejected_total[1m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit rejections > 100/s"
          description: "Possible abuse or misconfiguration"
