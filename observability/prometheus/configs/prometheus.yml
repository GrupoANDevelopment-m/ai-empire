global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: ai-empire

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: empire-api
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: ai-empire
        action: keep
    metrics_path: /metrics
    scrape_interval: 30s
  
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
