global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.sendgrid.net:587
  smtp_from: alerts@grupoan.dev
  smtp_auth_username: apikey
  smtp_require_tls: true

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: pagerduty
      continue: true
    - match:
        team: security
      receiver: security-team
      continue: true

receivers:
  - name: default
    slack_configs:
      - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
        channel: "#empire-alerts"
        title: "AI Empire Alert"
  
  - name: pagerduty
    pagerduty_configs:
      - service_key: YOUR_PAGERDUTY_KEY
        description: "{{ .GroupLabels.alertname }} - {{ .CommonAnnotations.summary }}"
  
  - name: security-team
    email_configs:
      - to: security@grupoan.dev
        send_resolved: true
    slack_configs:
      - channel: "#security-alerts"
        title: "Security Alert"
